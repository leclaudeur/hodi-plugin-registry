# Weekly update pull requests, grouped so a week brings at most one per ecosystem. Only the maintainer merges them.
# Minor and patch versions only: a major version waits for its ecosystem and is done by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
